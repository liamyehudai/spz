<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gaussian Splat Viewer — Babylon.js (Button Height Fixed)</title>
  <style>
    html, body { height: 100%; width: 100%; margin: 0; overflow: hidden; background: #0b0e11; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; display:block; }
    
    /* Existing Status Bar Styles */
    #status { position: fixed; left: 12px; bottom: 12px; color: #e5e7eb; font-size: 14px; line-height: 1.4; background: rgba(0,0,0,.55); padding: 10px 12px; border-radius: 10px; backdrop-filter: blur(6px); max-width: 60ch; box-sizing: border-box; z-index: 10; }
    #status b { color:#fff }
    .ok { color:#86efac }
    .warn { color:#fde68a }
    .err { color:#fca5a5 }
    
    /* Shared Button Styles */
    button, .button-fixed { display:inline-flex; align-items:center; justify-content:center; padding:8px 12px; background:linear-gradient(180deg,#0b0e11,#151a21); border:1px solid #2a3240; border-radius:10px; color:#e5e7eb; cursor:pointer; font-size:14px; line-height:1; height:auto; box-sizing:border-box; }
    button:hover, .button-fixed:hover { transform:translateY(-1px); box-shadow:0 2px 6px rgba(0,0,0,.4); border-color: #3b82f6; }
    
    /* Modal Styles */
    #introModal {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.5s ease;
    }
    #introModal.hidden { opacity: 0; pointer-events: none; }
    .modal-content {
      background: #111827; border: 1px solid #374151; padding: 2rem; border-radius: 16px;
      text-align: center; max-width: 90%; width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal-content h2 { margin-top: 0; color: #fff; margin-bottom: 0.5rem; }
    .modal-content p { color: #9ca3af; margin-bottom: 1.5rem; line-height: 1.5; }
    .play-btn {
      background: #2563eb; border: 1px solid #3b82f6; color: white;
      font-weight: 600; padding: 12px 24px; font-size: 16px;
    }
    .play-btn:hover { background: #1d4ed8; transform: translateY(-1px); }

    /* Audio Player Container */
    #audioContainer {
      position: fixed; right: 12px; bottom: 12px; z-index: 20;
      background: rgba(0,0,0,.55); padding: 8px; border-radius: 10px;
      backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; gap: 8px;
      transform: translateY(150%); /* Hidden initially */
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #audioContainer.visible { transform: translateY(0); }
    
    /* Customizing the HTML5 Audio element slightly */
    audio { height: 32px; opacity: 0.9; }
    
    /* Mobile tweaks */
    @media (max-width: 600px) {
      #status { bottom: 60px; left: 12px; right: 12px; max-width: none; }
      #audioContainer { bottom: 12px; right: 12px; left: 12px; justify-content: center; }
      audio { width: 100%; }
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="status" class="button-fixed">Loading…</div>

  <!-- Intro Modal -->
  <div id="introModal">
    <div class="modal-content">
      <h2>Oral History</h2>
      <p>Please enable audio to listen to the oral history associated with this scan.</p>
      <button id="startExperience" class="play-btn">
        <svg style="width:20px;height:20px;margin-right:8px" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        Play Audio
      </button>
    </div>
  </div>

  <!-- Persistent Audio Player -->
  <div id="audioContainer">
    <!-- Using the GitHub Pages URL for correct content type serving -->
    <audio id="historyAudio" controls controlsList="nodownload">
      <source src="https://liamyehudai.github.io/spz/OralHistory.m4a" type="audio/mp4">
      Your browser does not support the audio element.
    </audio>
  </div>

  <script>
  // --- Audio / Modal Logic ---
  document.addEventListener('DOMContentLoaded', () => {
    const modal = document.getElementById('introModal');
    const btn = document.getElementById('startExperience');
    const audio = document.getElementById('historyAudio');
    const audioContainer = document.getElementById('audioContainer');

    btn.addEventListener('click', () => {
      // 1. Fade out modal
      modal.classList.add('hidden');
      
      // 2. Play audio
      audio.play().then(() => {
        console.log("Audio playing");
      }).catch(e => {
        console.warn("Audio play blocked or failed", e);
      });

      // 3. Slide in the controls
      audioContainer.classList.add('visible');
    });
  });

  // --- Resilient script loader ---
  function loadScript(url){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=url;s.async=true;s.crossOrigin='anonymous';s.onload=()=>resolve(url);s.onerror=()=>reject(new Error('Failed '+url));document.head.appendChild(s);});}
  async function loadAny(urls){let last;for(const u of urls){try{return await loadScript(u);}catch(e){last=e;}}throw last||new Error('All sources failed');}

  const CDN={
    babylon:[
      'https://cdn.jsdelivr.net/npm/babylonjs@8.1.1/babylon.min.js',
      'https://unpkg.com/babylonjs@8.1.1/babylon.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/babylonjs/8.1.1/babylon.min.js'
    ],
    loaders:[
      'https://cdn.jsdelivr.net/npm/babylonjs-loaders@8.1.1/babylonjs.loaders.min.js',
      'https://unpkg.com/babylonjs-loaders@8.1.1/babylonjs.loaders.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/babylonjs/8.1.1/babylonjs.loaders.min.js'
    ],
    splat:[
      'https://cdn.jsdelivr.net/npm/@babylonjs/loaders@8.1.1/SPLAT/splatFileLoader.min.js',
      'https://unpkg.com/@babylonjs/loaders@8.1.1/SPLAT/splatFileLoader.min.js'
    ]
  };

  const statusEl=document.getElementById('status');
  function setStatus(msg){statusEl.innerHTML=msg;}

  (async function main(){
    try{
      setStatus('<b>Loading engine…</b>');
      await loadAny(CDN.babylon);
      if(!window.BABYLON) throw new Error('BABYLON not loaded');
      setStatus('<span class="ok">✓</span> Babylon loaded. <b>Loading loaders…</b>');
      await loadAny(CDN.loaders);
      try{await loadAny(CDN.splat);}catch(e){console.warn('SPLAT optional load failed.',e);}
      setStatus('<span class="ok">✓</span> Loaders ready. <b>Booting scene…</b>');
    }catch(e){console.error(e);setStatus('<span class="err">✗</span> Script load failed.');return;}

    const canvas=document.getElementById('renderCanvas');
    const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true,antialias:true});
    const scene=new BABYLON.Scene(engine);
    scene.clearColor=new BABYLON.Color4(0.03,0.05,0.07,1);

    const camera=new BABYLON.ArcRotateCamera('cam',Math.PI*1.25,Math.PI/2.3,0.25,BABYLON.Vector3.Zero(),scene);
    camera.attachControl(canvas,true);
    camera.lowerRadiusLimit=0.00005;camera.minZ=0.00005;camera.maxZ=100000;camera.wheelPrecision=18;camera.wheelDeltaPercentage=0.01;
    new BABYLON.HemisphericLight('h',new BABYLON.Vector3(0,1,0),scene).intensity=0;

    const splatUrl='https://liamyehudai.github.io/spz/assets/15.spz';
    const root=new BABYLON.TransformNode('root',scene);
    let result;
    try{result=await BABYLON.SceneLoader.ImportMeshAsync('',splatUrl.substring(0,splatUrl.lastIndexOf('/')+1),splatUrl.substring(splatUrl.lastIndexOf('/')+1),scene);}catch(e){console.error(e);setStatus('<span class="err">✗</span> Failed to load SPZ');return;}

    const meshes=(result&&result.meshes)||[];
    let min=new BABYLON.Vector3(+Infinity,+Infinity,+Infinity),max=new BABYLON.Vector3(-Infinity,-Infinity,-Infinity);
    for(const m of meshes){if(m.getBoundingInfo){const bi=m.getBoundingInfo();min=BABYLON.Vector3.Minimize(min,bi.boundingBox.minimumWorld);max=BABYLON.Vector3.Maximize(max,bi.boundingBox.maximumWorld);}m.parent=root;}
    const center=min.add(max).scale(0.5);root.position=center.scale(-1);root.rotation.x=Math.PI;

    const bboxLen=max.subtract(min).length();
    const ultraRadius=Math.max(0.00005,bboxLen*0.01625);
    camera.radius=ultraRadius;camera.target=BABYLON.Vector3.Zero();camera.beta=Math.PI/2.6;

    setStatus('<span class="ok">✓</span> Loaded. Fixed height buttons intact.');

    engine.runRenderLoop(()=>scene.render());window.addEventListener('resize',()=>engine.resize());
  })();
  </script>
</body>
</html>
